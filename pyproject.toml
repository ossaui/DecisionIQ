
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decisioniq"
version = "0.1.0"
description = "Universal Business Decision Intelligence Platform"
requires-python = ">=3.11"

dependencies = [
    "pandas",
    "numpy",
    "duckdb",
    "pyarrow",
    "pandera",
    "pyyaml",
    "openpyxl"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyter",
    "matplotlib"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
